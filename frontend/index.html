<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      No static title/description/canonical/robots tags here — every route sets these
      itself via react-helmet-async (see src/pages/*.jsx). react-helmet-async inserts
      its own tags via a React portal instead of replacing existing ones, so a static
      default here would end up duplicated (not replaced) once a page's Helmet mounts —
      e.g. an auth page's noindex tag would sit alongside this file's "index, follow"
      instead of overriding it.
    -->
    <meta
      name="keywords"
      content="Zuno AI, AI study companion, Class 10 Science, Class 10 Science AI, Science doubt solver, AI tutor, Class 10 tutor, Bihar Board Class 10 Science, NCERT Science, NCERT Class 10, Science questions and answers, AI education, online science tutor, Class 10 study app, AI learning assistant"
    />
    <meta name="author" content="Zuno" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zuno" />
    <meta property="og:locale" content="hi_IN" />
    <meta property="og:url" content="https://learnzuno.in/" />
    <meta property="og:title" content="Zuno — Bihar Board Class 10 Science AI Tutor | Hindi Mein Padho" />
    <meta
      property="og:description"
      content="Zuno AI Tutor se Bihar Board Class 10 Science ke doubts poochho — Hindi aur Hinglish mein. Physics, Chemistry, Biology — sab kuch Bihar Board syllabus se grounded jawab."
    />
    <meta property="og:image" content="https://learnzuno.in/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zuno — Bihar Board Class 10 Science AI Tutor | Hindi Mein Padho" />
    <meta
      name="twitter:description"
      content="Zuno AI Tutor se Bihar Board Class 10 Science ke doubts poochho — Hindi aur Hinglish mein. Physics, Chemistry, Biology — sab kuch Bihar Board syllabus se grounded jawab."
    />
    <meta name="twitter:image" content="https://learnzuno.in/og-image.png" />

    <!-- Google Search Console verification (DNS verification already used — placeholder kept for redundancy) -->
    <!-- <meta name="google-site-verification" content="REPLACE_WITH_CODE" /> -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Zuno",
        "url": "https://learnzuno.in/",
        "description": "Zuno AI Tutor se Bihar Board Class 10 Science ke doubts poochho — Hindi aur Hinglish mein.",
        "areaServed": "IN",
        "sameAs": []
      }
    </script>

    <link rel="icon" type="image/svg+xml" href="/zuno-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('zuno-theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <noscript>
        Zuno ek AI-powered study companion hai Bihar Board Class 10 Science students ke liye — Hindi aur Hinglish mein Physics, Chemistry, Biology ke doubts solve karta hai. Is app ko chalane ke liye apne browser mein JavaScript enable karo.
      </noscript>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
